<!doctype html><html><head><meta charset="utf-8"><title>Wood & Foliage</title>
<link rel="stylesheet" href="_card.css">
<style>
.grp { margin-bottom: 18px; }
.lab { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.s { aspect-ratio: 1/0.9; border-radius: 6px; position: relative; }
.s .info { position: absolute; bottom: 6px; left: 7px; font-family: var(--font-mono); font-size: 9px; color: rgba(255,255,255,0.92); }
.s.light .info { color: rgba(31,26,20,0.65); }
.hd h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin:0 0 14px 0; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Wood & Foliage — supporting</h3></div>
  <div class="grp">
    <div class="lab">Wood / window frames & shutters</div>
    <div class="swatches">
      <div class="s light" style="background:#F1E6D6"><span class="info">50</span></div>
      <div class="s" style="background:#D9BE94"><span class="info">100</span></div>
      <div class="s" style="background:#B89569"><span class="info">200</span></div>
      <div class="s" style="background:#946F47"><span class="info">300</span></div>
      <div class="s" style="background:#4A341F"><span class="info">500</span></div>
    </div>
  </div>
  <div class="grp">
    <div class="lab">Foliage / landscape & tags</div>
    <div class="swatches">
      <div class="s light" style="background:#ECF1E4"><span class="info">50</span></div>
      <div class="s light" style="background:#C5D2A8"><span class="info">100</span></div>
      <div class="s" style="background:#94AC76"><span class="info">200</span></div>
      <div class="s" style="background:#5E7E4A"><span class="info">300</span></div>
      <div class="s" style="background:#1F3219"><span class="info">500</span></div>
    </div>
  </div>
</div></body></html>
