<!doctype html><html><head><meta charset="utf-8"><title>Ink</title>
<link rel="stylesheet" href="_card.css">
<style>
.rows { display: flex; flex-direction: column; gap: 10px; }
.r { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 8px; background: var(--stucco-50); }
.sw { width: 36px; height: 36px; border-radius: 6px; }
.sample { font-family: var(--font-display); font-size: 22px; }
.tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
.hd h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin:0 0 14px 0; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Ink — text on cream</h3></div>
  <div class="rows">
    <div class="r"><div class="sw" style="background:#1F1A14"></div><div><div class="sample" style="color:#1F1A14">The light moves all day</div></div><div class="tok">fg-1 · #1F1A14</div></div>
    <div class="r"><div class="sw" style="background:#4F4639"></div><div><div class="sample" style="color:#4F4639">Stucco, terracotta, breeze</div></div><div class="tok">fg-2 · #4F4639</div></div>
    <div class="r"><div class="sw" style="background:#6C6356"></div><div><div class="sample" style="color:#6C6356">A long exhale</div></div><div class="tok">fg-3 · #6C6356</div></div>
  </div>
</div></body></html>
