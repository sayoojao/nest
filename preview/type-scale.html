<!doctype html><html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 12px 0; }
.row { display: grid; grid-template-columns: 1fr 90px; gap: 14px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid rgba(31,26,20,0.05); }
.row:last-child { border: none; }
.tk { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Type scale</h3></div>
  <div class="row"><span style="font-family:var(--font-display); font-size:64px; font-weight:400; line-height:1.05; letter-spacing:-0.02em">Display L</span><span class="tk">96 / serif</span></div>
  <div class="row"><span style="font-family:var(--font-display); font-size:42px; font-weight:400; line-height:1.1; letter-spacing:-0.02em">Heading 1</span><span class="tk">56 / serif</span></div>
  <div class="row"><span style="font-family:var(--font-display); font-size:30px; font-weight:400; line-height:1.2">Heading 2</span><span class="tk">40 / serif</span></div>
  <div class="row"><span style="font-family:'Manrope', sans-serif; font-size:18px; font-weight:600">H4 / lead</span><span class="tk">22 / sans</span></div>
  <div class="row"><span style="font-family:'Manrope', sans-serif; font-size:16px">Body — the standard paragraph size, set at 1.7 line-height.</span><span class="tk">16 / sans</span></div>
  <div class="row"><span style="font-family:'Manrope', sans-serif; font-size:12px; color:var(--fg-3)">Caption · meta info</span><span class="tk">12 / sans</span></div>
</div></body></html>
