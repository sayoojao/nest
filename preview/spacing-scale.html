<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 14px 0; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.r { display: grid; grid-template-columns: 70px 1fr 60px; align-items: center; gap: 14px; }
.bar { height: 14px; background: var(--terracotta-400); border-radius: 2px; }
.tk { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
.px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-align: right; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Spacing — 8px base</h3></div>
  <div class="rows">
    <div class="r"><span class="tk">--space-1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
    <div class="r"><span class="tk">--space-2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
    <div class="r"><span class="tk">--space-3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
    <div class="r"><span class="tk">--space-4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
    <div class="r"><span class="tk">--space-5</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
    <div class="r"><span class="tk">--space-6</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
    <div class="r"><span class="tk">--space-7</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
    <div class="r"><span class="tk">--space-8</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
    <div class="r"><span class="tk">--space-9</span><div class="bar" style="width:96px"></div><span class="px">96 px</span></div>
    <div class="r"><span class="tk">--space-10</span><div class="bar" style="width:128px"></div><span class="px">128 px</span></div>
  </div>
</div></body></html>
