<!doctype html><html><head><meta charset="utf-8"><title>Script + Eyebrow</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 14px 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
.cell { padding: 22px; border-radius: 10px; }
.cell.a { background: var(--stucco-200); }
.cell.b { background: var(--ink-300); }
.script { font-family: 'Caveat', cursive; font-size: 44px; line-height: 1; color: var(--terracotta-500); }
.eye { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--terracotta-500); }
.title { font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--stucco-100); margin-top: 8px; line-height: 1.1; }
.tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 10px; }
.tag2 { font-family: var(--font-mono); font-size: 10px; color: rgba(250,246,238,0.5); margin-top: 10px; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Accents — Script & Eyebrow</h3></div>
  <div class="row">
    <div class="cell a">
      <div class="script">the happy place</div>
      <div class="tag">Caveat · 500 · used only as the logo tagline & rare margin notes</div>
    </div>
    <div class="cell b">
      <div class="eye">Residence · 2024</div>
      <div class="title">Olipram</div>
      <div class="tag2">Eyebrow + display title pairing</div>
    </div>
  </div>
</div></body></html>
