<!doctype html><html><head><meta charset="utf-8"><title>Photography</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 6px 0; }
.hd .sub { font-size: 12px; color: var(--fg-3); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
.ph { background-size: cover; background-position: center; border-radius: 10px; aspect-ratio: 16/10; box-shadow: 0 2px 8px rgba(74,52,31,0.08); }
.tags { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.tag { font-family: 'Manrope'; font-size: 11px; padding: 5px 12px; border-radius: 999px; background: rgba(31,26,20,0.06); color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Photography — warm, sun-soaked</h3><div class="sub">Renders &amp; eventual photos share this grade</div></div>
  <div class="grid">
    <div class="ph" style="background-image:url(../assets/villa-day-front.jpeg)"></div>
    <div class="ph" style="background-image:url(../assets/villa-dusk.jpeg)"></div>
    <div class="ph" style="background-image:url(../assets/villa-detail-dots.jpeg)"></div>
  </div>
  <div class="tags"><span class="tag">Warm</span><span class="tag">Olive greens, not neon</span><span class="tag">Skies at the edges</span><span class="tag">No b&amp;w except plans</span></div>
</div></body></html>
