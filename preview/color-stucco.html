<!doctype html><html><head><meta charset="utf-8"><title>Stucco neutrals</title>
<link rel="stylesheet" href="_card.css">
<style>
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.s { aspect-ratio: 1/1.4; border-radius: 6px; position: relative; box-shadow: var(--shadow-xs); border: 1px solid var(--border-soft); }
.s .info { position: absolute; bottom: 6px; left: 7px; font-family: var(--font-mono); font-size: 9px; color: rgba(31,26,20,0.7); letter-spacing: 0.02em; }
.hd { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 14px; }
.hd h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin:0; }
.hd .sub { font-size: 12px; color: var(--fg-3); }
.row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.row2 > div { padding: 14px 16px; border-radius: 8px; font-size: 11px; }
.row2 .a { background: var(--stucco-100); color: var(--ink-300); }
.row2 .b { background: var(--ink-300); color: var(--stucco-100); }
.row2 .a::after { content: " — page bg"; opacity:0.5; }
.row2 .b::after { content: " — inverse bg"; opacity:0.5; }
</style></head>
<body><div class="card">
  <div class="hd">
    <h3>Stucco — warm cream neutrals</h3>
    <span class="sub">The page is never pure white</span>
  </div>
  <div class="swatches">
    <div class="s" style="background:#FDFBF6"><span class="info">50</span></div>
    <div class="s" style="background:#FAF6EE"><span class="info">100★</span></div>
    <div class="s" style="background:#F4ECDD"><span class="info">200</span></div>
    <div class="s" style="background:#EADDC4"><span class="info">300</span></div>
    <div class="s" style="background:#DCC8A4"><span class="info">400</span></div>
    <div class="s" style="background:#C6AC82"><span class="info">500</span></div>
  </div>
  <div class="row2">
    <div class="a">Aa #FAF6EE</div>
    <div class="b">Aa #1F1A14</div>
  </div>
</div></body></html>
