<!doctype html><html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="_card.css">
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 14px 16px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; min-height: 64px; display:flex; flex-direction: column; justify-content: space-between; }
.tile .tname { font-weight: 700; }
.tile .tval { opacity: 0.7; }
.hd h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin:0 0 14px 0; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Semantic tokens</h3></div>
  <div class="grid">
    <div class="tile" style="background:#FAF6EE; color:#1F1A14;"><span class="tname">--bg-page</span><span class="tval">#FAF6EE</span></div>
    <div class="tile" style="background:#1F1A14; color:#FAF6EE;"><span class="tname">--bg-inverse</span><span class="tval">#1F1A14</span></div>
    <div class="tile" style="background:#B6432A; color:#FAF6EE;"><span class="tname">--bg-accent</span><span class="tval">#B6432A</span></div>
    <div class="tile" style="background:#FDFBF6; color:#1F1A14; border:1px solid rgba(31,26,20,0.08);"><span class="tname">--bg-card</span><span class="tval">#FDFBF6</span></div>
    <div class="tile" style="background:#F4ECDD; color:#1F1A14;"><span class="tname">--bg-page-deep</span><span class="tval">#F4ECDD</span></div>
    <div class="tile" style="background:#5E7E4A; color:#FAF6EE;"><span class="tname">--foliage-300</span><span class="tval">tags & landscape</span></div>
  </div>
</div></body></html>
