<!doctype html><html><head><meta charset="utf-8"><title>Terracotta</title>
<link rel="stylesheet" href="_card.css">
<style>
.swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.s { aspect-ratio: 1/1.4; border-radius: 6px; position: relative; box-shadow: var(--shadow-xs); }
.s .info { position: absolute; bottom: 6px; left: 7px; font-family: var(--font-mono); font-size: 9px; color: rgba(255,255,255,0.92); letter-spacing: 0.02em; }
.s.light .info { color: rgba(31,26,20,0.7); }
.hd { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 14px; }
.hd h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin:0; }
.hd .sub { font-size: 12px; color: var(--fg-3); font-family: var(--font-body); }
</style></head>
<body><div class="card">
  <div class="hd">
    <h3>Terracotta — brand accent</h3>
    <span class="sub">From the roof tiles & dot motif</span>
  </div>
  <div class="swatches">
    <div class="s light" style="background:#FBEFE9"><span class="info">50</span></div>
    <div class="s light" style="background:#F4D8CC"><span class="info">100</span></div>
    <div class="s light" style="background:#E8B19E"><span class="info">200</span></div>
    <div class="s" style="background:#DA8B70"><span class="info">300</span></div>
    <div class="s" style="background:#C96B4C"><span class="info">400</span></div>
    <div class="s" style="background:#B6432A"><span class="info">500★</span></div>
    <div class="s" style="background:#9A3520"><span class="info">600</span></div>
    <div class="s" style="background:#76281A"><span class="info">700</span></div>
    <div class="s" style="background:#511C14"><span class="info">800</span></div>
    <div class="s" style="background:#2E110D"><span class="info">900</span></div>
  </div>
</div></body></html>
