<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 14px 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cell { padding: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
.cell.cream { background: var(--stucco-200); }
.cell.dark { background: #1F1A14; }
.cell.tc { background: #B6432A; }
.lock { display: flex; flex-direction: column; align-items: flex-start; }
.lock .w { font-family: var(--font-display); font-size: 52px; line-height: 0.9; letter-spacing: -0.02em; }
.lock .t { font-family: 'Caveat', cursive; font-size: 22px; margin-top: 0px; }
.cream .w { color: #1F1A14; }
.cream .t { color: #B6432A; }
.dark .w { color: #FAF6EE; }
.dark .t { color: #C96B4C; }
.tc .w { color: #FAF6EE; }
.tc .t { color: #1F1A14; opacity: 0.7; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Wordmark — Cormorant + Caveat lockup</h3></div>
  <div class="row">
    <div class="cell cream"><div class="lock"><span class="w">Nest</span><span class="t">the happy place</span></div></div>
    <div class="cell dark"><div class="lock"><span class="w">Nest</span><span class="t">the happy place</span></div></div>
  </div>
</div></body></html>
