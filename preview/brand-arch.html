<!doctype html><html><head><meta charset="utf-8"><title>Arched window</title>
<link rel="stylesheet" href="_card.css">
<style>
.hd h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin:0 0 6px 0; }
.hd .sub { font-size: 12px; color: var(--fg-3); margin-bottom: 14px; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.arch { aspect-ratio: 3/4; background-size: cover; background-position: center; border-radius: 999px 999px 8px 8px / 200px 200px 8px 8px; box-shadow: 0 8px 24px rgba(74,52,31,0.10); }
.code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 14px; background: var(--stucco-200); padding: 10px 12px; border-radius: 6px; line-height: 1.5; }
</style></head>
<body><div class="card">
  <div class="hd"><h3>Arched window — the brand's shape</h3><div class="sub">Used on hero images & project thumbnails</div></div>
  <div class="row">
    <div class="arch" style="background-image:url(../assets/villa-day-front.jpeg)"></div>
    <div class="arch" style="background-image:url(../assets/villa-dusk.jpeg)"></div>
    <div class="arch" style="background-image:url(../assets/villa-detail-dots.jpeg)"></div>
  </div>
  <div class="code">border-radius: 999px 999px 8px 8px / 200px 200px 8px 8px;</div>
</div></body></html>
