<!doctype html><html><head><meta charset="utf-8"><title>Header</title>
<link rel="stylesheet" href="_card.css">
<style>
body, html { background: #1F1A14; }
.card { padding: 0; min-height: 100%; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; background: rgba(31,26,20,0.55); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(250,246,238,0.08); }
.logo { display: flex; flex-direction: column; }
.logo .w { font-family: var(--font-display); font-size: 28px; color: #FAF6EE; line-height: 0.95; letter-spacing: -0.02em; }
.logo .t { font-family: 'Caveat', cursive; font-size: 14px; color: #C96B4C; margin-top: 2px; }
.nav { display: flex; gap: 28px; }
.nav a { color: #FAF6EE; font-family: 'Manrope'; font-size: 13px; font-weight: 500; opacity: 0.85; text-decoration: none; border: none; }
.nav a:hover { opacity: 0.6; }
.cta { background: #B6432A; color: #FAF6EE; padding: 10px 18px; border-radius: 6px; font-family: 'Manrope'; font-size: 13px; font-weight: 500; }
.hero { padding: 40px 32px 28px; }
.hero .eye { font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #C96B4C; }
.hero .h { font-family: var(--font-display); font-size: 32px; color: #FAF6EE; margin-top: 8px; line-height: 1.05; letter-spacing: -0.02em; }
.hero .h em { font-style: italic; color: #C96B4C; }
</style></head>
<body><div class="card">
  <div class="header">
    <div class="logo"><span class="w">Nest</span><span class="t">the happy place</span></div>
    <div class="nav"><a>Work</a><a>Studio</a><a>Journal</a><a>Contact</a></div>
    <a class="cta">Start a project →</a>
  </div>
  <div class="hero">
    <div class="eye">Demo — header over dark hero</div>
    <div class="h">A <em>long</em> exhale, in stucco &amp; terracotta.</div>
  </div>
</div></body></html>
